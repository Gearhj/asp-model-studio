name: Security Gate

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  containment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ATLAS_AUTH_ENABLED: "true"
      ATLAS_LOCAL_DEV: "false"
      ATLAS_HOSTED_MODE: "false"
      ATLAS_ALLOW_PUBLIC_REGISTRATION: "false"
      ATLAS_ENABLE_DEV_USER_HEADER: "false"
      ATLAS_ENABLE_LOCAL_USER_BOOTSTRAP: "false"
      ATLAS_SECURITY_DB_PATH: ${{ runner.temp }}/atlas-security-gate.db
      ATLAS_SQLITE_PATH: ${{ runner.temp }}/atlas-persistence-gate.db

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Install focused backend environment
        run: python -m pip install -r server/requirements.txt

      - name: TypeScript compilation
        run: npx tsc -b

      - name: Canonical security gate
        run: npm run test:security

      - name: Focused containment confirmation
        run: python tests/security_containment_test.py
